server:
  http_listen_port: 9080
  log_level: info

positions:
  filename: /tmp/positions.yaml

client:
  url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: day23-app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: day23-app
          service: inference-api
          __path__: /var/log/day23/*.log
    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            timestamp: timestamp
            trace_id: trace_id
            model: model
            event: event
            input_tokens: input_tokens
            output_tokens: output_tokens
            duration_seconds: duration_seconds
      # Parse JSON log message
      - json:
          source: log
          expressions:
            trace_id: trace_id
            model: model
            event: event
      - labels:
          stream:
          event:
          model:
